<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Teamplanner + Chat</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #111;
        color: white;
        margin: 0;
        padding: 0;
        text-align: center;
    }

    h1 {
        margin: 20px 0;
        color: #00eaff;
    }

    #container {
        display: flex;
        justify-content: center;
        gap: 20px;
        padding: 20px;
        flex-wrap: wrap;
    }

    /* Kalender */
    #calendar {
        width: 600px;
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 6px;
    }

    .day {
        background: #1a1a1a;
        padding: 15px;
        border-radius: 8px;
        min-height: 100px;
        cursor: pointer;
        border: 1px solid #333;
        transition: 0.2s;
    }

    .day:hover {
        background: #222;
        transform: scale(1.03);
    }

    .day-number {
        font-size: 18px;
        font-weight: bold;
        color: #00eaff;
        margin-bottom: 6px;
    }

    .task {
        background: #ff0080;
        padding: 4px 6px;
        border-radius: 4px;
        margin-top: 4px;
        font-size: 13px;
        text-align: left;
        cursor: pointer;
    }

    /* Popup */
    #popup {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: #222;
        padding: 20px;
        border-radius: 10px;
        width: 300px;
        display: none;
        box-shadow: 0 0 20px #00eaff;
        z-index: 999;
    }

    #popup input {
        width: 90%;
        padding: 10px;
        margin: 10px 0;
        border-radius: 6px;
        border: none;
    }

    #popup button {
        padding: 10px 16px;
        border: none;
        border-radius: 6px;
        background: #00eaff;
        color: black;
        font-weight: bold;
        cursor: pointer;
        margin: 5px;
    }

    #popup button:hover {
        background: #33f3ff;
    }

    #closeBtn {
        background: #ff0080;
        color: white;
    }

    /* Chat */
    #chatBox {
        width: 300px;
        height: 500px;
        background: #1a1a1a;
        border-radius: 10px;
        padding: 10px;
        border: 1px solid #333;
        display: flex;
        flex-direction: column;
    }

    #messages {
        flex: 1;
        overflow-y: auto;
        text-align: left;
        padding-right: 5px;
    }

    .msg {
        background: #333;
        padding: 6px 8px;
        border-radius: 6px;
        margin-bottom: 6px;
        font-size: 14px;
    }

    #chatInput {
        width: 90%;
        padding: 10px;
        border-radius: 6px;
        border: none;
        margin-top: 10px;
    }

    #sendBtn {
        margin-top: 8px;
        padding: 8px 14px;
        background: #00eaff;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
    }

    #sendBtn:hover {
        background: #33f3ff;
    }
</style>
</head>
<body>

<h1>📅 Teamplanner + 💬 Teamchat</h1>

<div id="container">

    <!-- Kalender -->
    <div id="calendar"></div>

    <!-- Chat -->
    <div id="chatBox">
        <h3>Teamchat</h3>
        <div id="messages"></div>
        <input id="chatInput" type="text" placeholder="Typ een bericht...">
        <button id="sendBtn" onclick="sendMessage()">Verstuur</button>
    </div>

</div>

<!-- Popup -->
<div id="popup">
    <h3>Taak toevoegen</h3>
    <input id="taskInput" type="text" placeholder="Taak / persoon...">
    <br>
    <button onclick="saveTask()">Opslaan</button>
    <button id="closeBtn" onclick="closePopup()">Sluiten</button>
</div>

<script>
/* ------------------------------
   KALENDER + TAKEN
------------------------------ */

let selectedDay = null;
let tasks = JSON.parse(localStorage.getItem("tasks")) || {};

function generateCalendar() {
    const calendar = document.getElementById("calendar");
    calendar.innerHTML = "";

    for (let i = 1; i <= 31; i++) {
        const day = document.createElement("div");
        day.className = "day";
        day.onclick = () => openPopup(i);

        day.innerHTML = `
            <div class="day-number">${i}</div>
            <div id="tasks-${i}"></div>
        `;

        calendar.appendChild(day);
    }

    renderTasks();
}

function openPopup(day) {
    selectedDay = day;
    document.getElementById("popup").style.display = "block";
}

function closePopup() {
    document.getElementById("popup").style.display = "none";
}

function saveTask() {
    const text = document.getElementById("taskInput").value.trim();
    if (!text) return;

    if (!tasks[selectedDay]) tasks[selectedDay] = [];
    tasks[selectedDay].push(text);

    localStorage.setItem("tasks", JSON.stringify(tasks));

    document.getElementById("taskInput").value = "";
    closePopup();
    renderTasks();
}

function renderTasks() {
    for (let i = 1; i <= 31; i++) {
        const container = document.getElementById(`tasks-${i}`);
        container.innerHTML = "";

        if (tasks[i]) {
            tasks[i].forEach((t, index) => {
                const div = document.createElement("div");
                div.className = "task";
                div.innerText = t;

                div.onclick = (event) => {
                    event.stopPropagation();
                    if (confirm("Taak verwijderen?")) {
                        tasks[i].splice(index, 1);
                        localStorage.setItem("tasks", JSON.stringify(tasks));
                        renderTasks();
                    }
                };

                container.appendChild(div);
            });
        }
    }
}

generateCalendar();

/* ------------------------------
   CHAT
------------------------------ */

let messages = JSON.parse(localStorage.getItem("messages")) || [];

function renderMessages() {
    const box = document.getElementById("messages");
    box.innerHTML = "";

    messages.forEach(msg => {
        const div = document.createElement("div");
        div.className = "msg";
        div.innerText = msg;
        box.appendChild(div);
    });

    box.scrollTop = box.scrollHeight;
}

function sendMessage() {
    const input = document.getElementById("chatInput");
    const text = input.value.trim();
    if (!text) return;

    messages.push(text);
    localStorage.setItem("messages", JSON.stringify(messages));

    input.value = "";
    renderMessages();
}

renderMessages();
</script>

</body>
</html>
